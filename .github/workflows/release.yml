# ─────────────────────────────────────────────────────────────────────────────
# Build + (optional) SignPath code signing for OSS releases.
#
# The workflow is GREEN even before SignPath is configured: if the signing
# credentials are absent it simply publishes an UNSIGNED build and emits a
# warning. Once configured it automatically signs.
#
# To ENABLE signing (after SignPath Foundation approval):
#   Repository secrets   : SIGNPATH_API_TOKEN              (from SignPath UI)
#   Repository variables : SIGNPATH_ORGANIZATION_ID        (SignPath org id)
#                          SIGNPATH_PROJECT_SLUG           (e.g. unlock-keepawake)
#                          SIGNPATH_SIGNING_POLICY_SLUG    (e.g. release-signing)
#   Also: install the SignPath GitHub App for this repository.
#
# OSS rule: the signing request must originate from a GitHub-hosted runner and
# the unsigned build must be uploaded as a workflow artifact first.
# Docs: https://docs.signpath.io/trusted-build-systems/github
# ─────────────────────────────────────────────────────────────────────────────

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the GitHub release

jobs:
  build-sign-release:
    # Pinned image: avoids the ubuntu-latest -> Ubuntu 26 migration surprise.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.0"
          fi
          IFS='.' read -ra P <<< "$V"
          while [ "${#P[@]}" -lt 4 ]; do P+=("0"); done
          FV="${P[0]}.${P[1]}.${P[2]}.${P[3]}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "file_version=$FV" >> "$GITHUB_OUTPUT"

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Generate Windows resources (icon + manifest + version)
        run: |
          "$(go env GOPATH)/bin/go-winres" make \
            --in winres/winres.json \
            --arch amd64 \
            --out rsrc \
            --file-version "${{ steps.ver.outputs.file_version }}" \
            --product-version "${{ steps.ver.outputs.file_version }}"

      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o unlock-keepawake.exe .

      # ── 1) upload the UNSIGNED artifact so SignPath can verify its origin ──
      - name: Upload unsigned artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: unlock-keepawake-unsigned
          path: unlock-keepawake.exe
          if-no-files-found: error

      # ── 2) decide whether SignPath is configured ──
      - name: Detect SignPath configuration
        id: signcfg
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SignPath signing: ENABLED"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=SignPath not configured::Signing skipped; releasing an UNSIGNED build. Set SIGNPATH_API_TOKEN and SIGNPATH_ORGANIZATION_ID to enable signing."
          fi

      # ── 3) submit the signing request (only when configured) ──
      - name: Submit signing request
        if: steps.signcfg.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'unlock-keepawake' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: './signed'

      # ── 4) stage whichever build we are shipping ──
      - name: Stage release artifact
        id: stage
        run: |
          mkdir -p dist
          if [ "${{ steps.signcfg.outputs.enabled }}" = "true" ]; then
            cp ./signed/unlock-keepawake.exe dist/unlock-keepawake.exe
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            cp unlock-keepawake.exe dist/unlock-keepawake.exe
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          ls -l dist/

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: unlock-keepawake-release
          path: dist/unlock-keepawake.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/unlock-keepawake.exe
